schema_version: 1

context:
  name: globus-cli
  version: 3.43.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: f6926bac91ce2d84d1317fd84d9d94f3b4e6e5054102740f9bf7bb22bbf42efc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.11
    - pip
  run:
    - python >=${{ python_min }}
    - globus-sdk ==4.9.0
    - click >=8.4,<8.5
    - jmespath ==1.1.0
    - packaging >=17.0
    - requests >=2.34.2,<3.0.0
    - typing_extensions >=4.0
tests:
  - python:
      imports:
        - globus_cli
        - globus_cli.commands
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
    script:
      - globus --help
      - pip check

about:
  summary: Globus CLI
  description: A Command Line Interface to Globus.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/globus/globus-cli
  repository: https://github.com/globusonline/globus-cli
  documentation: https://globus.github.io/globus-cli

extra:
  recipe-maintainers:
    - xylar
